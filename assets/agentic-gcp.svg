<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-label="An agentic data platform on Google Cloud: an observe-plan-act agent loop supervising an ingest, orchestrate, transform and warehouse pipeline, over Dataplex governance and Terraform infrastructure">
  <title>Agentic data platform on GCP</title>
  <style>
    .lbl   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ttl   { font-size: 19px; font-weight: 700; fill: #fff; }
    .sub   { font-size: 12px; fill: #fff; opacity: .82; letter-spacing: .4px; }
    .pill  { font-size: 14px; font-weight: 600; fill: #fff; }
    .bar   { font-size: 13px; font-weight: 600; fill: #fff; letter-spacing: .3px; }
    .kick  { font-size: 13px; font-weight: 600; fill: #8B949E; letter-spacing: 2.2px; }
    .edge  { font-size: 11px; fill: #8B949E; letter-spacing: 1px; }

    .packet { transform-box: view-box; animation: flow 5s linear infinite; }
    .p2 { animation-delay: -1.25s } .p3 { animation-delay: -2.5s } .p4 { animation-delay: -3.75s }
    @keyframes flow {
      from { transform: translateX(0);     opacity: 0 }
      6%   { opacity: 1 }
      94%  { opacity: 1 }
      to   { transform: translateX(760px); opacity: 0 }
    }

    .dash { stroke-dasharray: 7 7; animation: march 1.1s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -28 } }

    .ring { stroke: #FBBC04; stroke-width: 3; fill: none; opacity: 0; animation: glow 3.6s ease-in-out infinite; }
    .r2 { animation-delay: 1.2s } .r3 { animation-delay: 2.4s }
    @keyframes glow { 0%,26% { opacity: 1 } 34%,100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .packet, .dash, .ring { animation: none }
      .packet { opacity: 1 } .ring { opacity: .35 }
    }
  </style>

  <text class="lbl kick" x="40" y="26">AGENTIC DATA PLATFORM · GCP</text>

  <!-- agent control loop -->
  <path d="M715 46 C715 8, 395 8, 395 46" fill="none" stroke="#6E62C4" stroke-width="2.5" class="dash"/>
  <path d="M395 52 l-6 -9 l12 0 Z" fill="#6E62C4"/>
  <g>
    <rect x="330" y="52" width="130" height="44" rx="22" fill="#3B3480"/>
    <rect class="ring"    x="330" y="52" width="130" height="44" rx="22"/>
    <text class="lbl pill" x="395" y="80" text-anchor="middle">Observe</text>
    <rect x="490" y="52" width="130" height="44" rx="22" fill="#3B3480"/>
    <rect class="ring r2" x="490" y="52" width="130" height="44" rx="22"/>
    <text class="lbl pill" x="555" y="80" text-anchor="middle">Plan</text>
    <rect x="650" y="52" width="130" height="44" rx="22" fill="#3B3480"/>
    <rect class="ring r3" x="650" y="52" width="130" height="44" rx="22"/>
    <text class="lbl pill" x="715" y="80" text-anchor="middle">Act</text>
    <path d="M462 74 H486" stroke="#6E62C4" stroke-width="2.5"/><path d="M490 74 l-7 -4 l0 8 Z" fill="#6E62C4"/>
    <path d="M622 74 H646" stroke="#6E62C4" stroke-width="2.5"/><path d="M650 74 l-7 -4 l0 8 Z" fill="#6E62C4"/>
  </g>

  <!-- feedback: telemetry up, actions down -->
  <path d="M875 178 V132 H395 V100" fill="none" stroke="#8B949E" stroke-width="2" class="dash"/>
  <path d="M395 96 l-5 8 l10 0 Z" fill="#8B949E"/>
  <text class="lbl edge" x="600" y="124" text-anchor="middle">telemetry · cost · freshness</text>

  <path d="M715 100 V156 H495 V176" fill="none" stroke="#8B949E" stroke-width="2" class="dash"/>
  <path d="M495 180 l-5 -8 l10 0 Z" fill="#8B949E"/>
  <text class="lbl edge" x="605" y="148" text-anchor="middle">backfill · retry · scale</text>

  <!-- pipeline rail + packets (occluded by the cards drawn after) -->
  <path d="M115 220 H875" stroke="#9AA4AE" stroke-width="3" opacity=".4"/>
  <g fill="#FBBC04">
    <circle class="packet"    cx="115" cy="220" r="7"/>
    <circle class="packet p2" cx="115" cy="220" r="7"/>
    <circle class="packet p3" cx="115" cy="220" r="7"/>
    <circle class="packet p4" cx="115" cy="220" r="7"/>
  </g>

  <!-- pipeline stages -->
  <g>
    <rect x="40"  y="180" width="150" height="80" rx="11" fill="#5F6B7A"/>
    <text class="lbl ttl" x="115" y="216" text-anchor="middle">Sources</text>
    <text class="lbl sub" x="115" y="236" text-anchor="middle">Pub/Sub · GCS</text>

    <rect x="230" y="180" width="150" height="80" rx="11" fill="#4285F4"/>
    <text class="lbl ttl" x="305" y="216" text-anchor="middle">Cloud Run</text>
    <text class="lbl sub" x="305" y="236" text-anchor="middle">INGEST</text>

    <rect x="420" y="180" width="150" height="80" rx="11" fill="#34A853"/>
    <text class="lbl ttl" x="495" y="216" text-anchor="middle">Composer</text>
    <text class="lbl sub" x="495" y="236" text-anchor="middle">ORCHESTRATE</text>

    <rect x="610" y="180" width="150" height="80" rx="11" fill="#EA4335"/>
    <text class="lbl ttl" x="685" y="216" text-anchor="middle">dbt</text>
    <text class="lbl sub" x="685" y="236" text-anchor="middle">TRANSFORM</text>

    <rect x="800" y="180" width="150" height="80" rx="11" fill="#1967D2"/>
    <text class="lbl ttl" x="875" y="216" text-anchor="middle">BigQuery</text>
    <text class="lbl sub" x="875" y="236" text-anchor="middle">WAREHOUSE</text>
  </g>

  <!-- substrate layers -->
  <rect x="40" y="286" width="910" height="34" rx="9" fill="#0B7C7C"/>
  <text class="lbl bar" x="495" y="308" text-anchor="middle">Dataplex — catalog · lineage · governance</text>

  <rect x="40" y="332" width="910" height="34" rx="9" fill="#5C4EE5"/>
  <text class="lbl bar" x="495" y="354" text-anchor="middle">Terraform — infrastructure as code</text>
</svg>
