<svg xmlns="http://www.w3.org/2000/svg" viewBox="-115 0 735 530" width="735" height="530" role="img" aria-label="A squirrel lunging for an acorn that keeps escaping, catching it at last, then losing it again">
  <title>The eternal acorn</title>
  <style>
    .squirrel {
      transform-box: view-box;
      transform-origin: 250px 490px;
      animation: lunge 6s cubic-bezier(.34,1.4,.64,1) infinite;
    }
    .acorn {
      transform-box: view-box;
      transform-origin: 124px 360px;
      animation: escape 6s cubic-bezier(.34,1.4,.64,1) infinite;
    }
    @keyframes lunge {
      0%,4%   { transform: rotate(0deg)    translate(0,0); }
      18%     { transform: rotate(-6deg)   translate(-10px,0); }
      26%     { transform: rotate(3deg)    translate(5px,0); }
      42%     { transform: rotate(-8deg)   translate(-13px,0); }
      50%     { transform: rotate(4deg)    translate(6px,0); }
      66%     { transform: rotate(-10deg)  translate(-18px,0); }
      72%     { transform: rotate(0deg)    translate(0,0); }
      76%     { transform: rotate(0deg)    translate(0,-14px); }
      80%     { transform: rotate(0deg)    translate(0,0); }
      84%     { transform: rotate(0deg)    translate(0,-8px); }
      88%     { transform: rotate(0deg)    translate(0,0); }
      94%     { transform: rotate(9deg)    translate(8px,0); }
      100%    { transform: rotate(0deg)    translate(0,0); }
    }
    @keyframes escape {
      0%,4%   { transform: translate(0,0)          rotate(0deg);   opacity: 1; }
      18%     { transform: translate(-6px,-8px)    rotate(-8deg);  opacity: 1; }
      24%     { transform: translate(-72px,2px)    rotate(-40deg); opacity: 1; }
      42%     { transform: translate(-60px,-8px)   rotate(-30deg); opacity: 1; }
      48%     { transform: translate(-128px,4px)   rotate(-80deg); opacity: 1; }
      64%     { transform: translate(-32px,-18px)  rotate(-20deg); opacity: 1; }
      72%     { transform: translate(22px,10px)    rotate(6deg);   opacity: 1; }
      88%     { transform: translate(22px,10px)    rotate(6deg);   opacity: 1; }
      95%     { transform: translate(-46px,-150px) rotate(120deg); opacity: 1; }
      97%     { transform: translate(-60px,-190px) rotate(160deg); opacity: 0; }
      99%     { transform: translate(0,0)          rotate(0deg);   opacity: 0; }
      100%    { transform: translate(0,0)          rotate(0deg);   opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .squirrel, .acorn { animation: none; }
    }
  </style>

  <g class="squirrel">
    <!-- tail -->
    <g fill="#A8703F">
      <circle cx="358" cy="80"  r="26"/><circle cx="402" cy="102" r="30"/>
      <circle cx="452" cy="134" r="34"/><circle cx="494" cy="184" r="38"/>
      <circle cx="522" cy="250" r="40"/><circle cx="528" cy="322" r="40"/>
      <circle cx="510" cy="390" r="38"/><circle cx="470" cy="440" r="34"/>
      <circle cx="424" cy="468" r="30"/><circle cx="378" cy="76"  r="22"/>
      <circle cx="376" cy="120" r="22"/><circle cx="382" cy="190" r="24"/>
      <circle cx="378" cy="260" r="26"/><circle cx="384" cy="330" r="28"/>
      <circle cx="398" cy="396" r="28"/>
    </g>
    <path d="M396 452 C366 372, 378 288, 398 214 C414 154, 400 104, 360 74
             C396 78, 436 104, 464 142 C508 200, 528 268, 522 330
             C514 400, 476 442, 428 462 Z" fill="#A8703F"/>
    <path d="M410 424 C394 358, 404 288, 420 228 C432 182, 428 146, 408 118
             C436 140, 458 178, 468 222 C480 274, 478 326, 464 370
             C454 400, 434 418, 414 428 Z" fill="#D9A46E"/>

    <g stroke="#8C5730" stroke-width="3" stroke-linejoin="round">
      <path d="M250 300 C322 288, 398 322, 410 386 C422 452, 368 474, 298 470 C232 466, 196 430, 203 377 C208 337, 224 305, 250 300 Z" fill="#BE7F45"/>
      <path d="M238 336 C270 324, 304 344, 312 386 C320 430, 294 454, 256 450 C224 446, 209 418, 213 386 C216 360, 226 341, 238 336 Z" fill="#F2DFC2" stroke="none"/>
      <path d="M250 454 C224 454, 203 465, 203 478 C203 491, 225 496, 250 492 C275 488, 287 475, 280 462 Z" fill="#96602F"/>
      <ellipse cx="246" cy="228" rx="76" ry="70" fill="#BE7F45"/>
      <path d="M198 204 C168 207, 148 224, 150 245 C152 264, 175 272, 198 265 C215 260, 223 238, 218 219 Z" fill="#C58A55"/>
      <path d="M264 172 C252 128, 266 94, 294 90 C298 74, 305 72, 307 88 C327 98, 335 132, 321 168 C309 198, 278 200, 264 172 Z" fill="#A8703F"/>
    </g>
    <path d="M276 166 C268 134, 278 110, 294 110 C308 110, 314 136, 304 162 Z" fill="#D9A46E"/>
    <path d="M204 248 C188 250, 178 260, 182 270 C186 280, 204 282, 216 274 Z" fill="#F2DFC2" opacity="0.7"/>
    <circle cx="207" cy="214" r="12" fill="#2B1B10"/>
    <circle cx="211" cy="210" r="4"  fill="#FFFFFF"/>
    <ellipse cx="154" cy="240" rx="9.5" ry="7.5" fill="#4A2C18"/>
    <g stroke="#8C5730" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none">
      <path d="M148 254 C124 263, 108 275, 100 289"/>
      <path d="M150 260 C130 275, 120 291, 118 307"/>
      <path d="M146 230 C120 226, 102 220, 92 210"/>
    </g>
    <!-- foreleg, reaching -->
    <path d="M262 332 C230 336, 198 344, 178 356" fill="none" stroke="#BE7F45" stroke-width="32" stroke-linecap="round"/>
    <path d="M182 342 C166 342, 154 350, 154 362 C154 374, 170 378, 184 371 Z" fill="#C58A55" stroke="#8C5730" stroke-width="3"/>
  </g>

  <g class="acorn">
    <path d="M120 330 L120 316 C120 308, 132 308, 132 316" fill="none" stroke="#6E4522" stroke-width="7" stroke-linecap="round"/>
    <path d="M88 350 C88 333, 104 322, 124 322 C144 322, 160 333, 160 350 Z" fill="#6E4522"/>
    <path d="M94 350 C94 378, 108 400, 124 400 C140 400, 154 378, 154 350 Z" fill="#CE9A5C"/>
  </g>
</svg>
